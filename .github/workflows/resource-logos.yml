name: Resource logos

# Fetches logos for entries on /resources that don't have one yet and commits them to the chosen
# branch. Run it by hand from the Actions tab after adding resources. It doesn't run on every push
# because commits made by this workflow don't trigger the pull request checks; push again after it
# runs so CI checks the new logos. Until then, cards show the resource's initials.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch missing logos
        run: npm run --silent logos:resources
      - name: Commit new logos
        id: commit
        run: |
          git add public/img/resources
          if git diff --cached --quiet; then
            echo "No new logos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add logos for resources"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # The token is only handed to git here, after npm install and the logo script have run
      - name: Push new logos
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --no-verify
