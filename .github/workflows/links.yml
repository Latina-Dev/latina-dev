name: Member links

# Checks member websites and GitHub accounts.
# - On pull requests that add or edit a profile, fails if one of its links is dead.
# - Weekly, opens (or updates) one pull request that points moved websites at their new address and
#   drops dead links, which are optional. Timeouts and sites that block bots are only listed.
# Pull requests opened with the default token don't start the required checks. Add a fine-grained
# token with contents and pull request write access as the MEMBER_LINKS_TOKEN secret so they do;
# without it, close and reopen the pull request to start them.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - data/members/**

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check links in added or edited profiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # HEAD is the merge commit, so HEAD^1 is the base branch
        run: |
          files=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'data/members/*.md')
          if [ -z "$files" ]; then
            echo "No added or edited profiles"
            exit 0
          fi
          # shellcheck disable=SC2086
          npm run --silent links:members -- $files

  fix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fix member links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent links:members -- --fix
      - name: Commit fixes
        id: commit
        run: |
          if git diff --quiet -- data/members; then
            echo "Nothing to fix"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/member-links
          git commit -m "Fix broken member links" -- data/members
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # The token is only handed to git and gh here, after npm install and the check have run
      - name: Open or update the pull request
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MEMBER_LINKS_TOKEN || github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --no-verify origin automation/member-links
          gh label create links --color 9e0001 --description "Broken member links" --force
          pr=$(gh pr list --head automation/member-links --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file member-links.md
          else
            gh pr create --base main --head automation/member-links --title "Fix broken member links" \
              --label links --assignee FrancesCoronel --body-file member-links.md
          fi
