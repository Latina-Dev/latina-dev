name: Greetings

on: [pull_request_target, issues]

permissions:
  contents: read

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: "Thank you for raising an issue! Please make sure you have given us enough context and we will review it as soon as possible. ⏲️ If you don't hear back from anyone within the next week, feel free to reach out to one of the maintainers. 💛"
          pr_message: "Thanks for opening this pull request! Please make sure you have followed our contributing guidelines and we will review it as soon as possible. ⏲️ If you don't hear back from anyone within the next week, feel free to reach out to one of the maintainers. 💛"
