name: Slack feeds

# Shares new posts from Latina engineers in Slack: members' blogs (the `blog` profile field) in
# #member-posts and the curated creators in lib/creatorFeeds.ts in #creator-feed.
# - Daily, posts what was published the previous UTC day.
# - Weekly, and on pull requests that change the feed list or code, checks every feed and fails
#   if a curated creator's feed is dead or hasn't posted in 180 days.
# Needs the SLACK_BOT_TOKEN secret (the site's Slack bot) and the SLACK_MEMBER_POSTS_CHANNEL_ID and
# SLACK_CREATOR_FEED_CHANNEL_ID repository variables. Without them the daily run only prints.

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "30 14 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "post (yesterday's new posts) or check (feed health)"
        required: false
        default: check
        type: choice
        options:
          - check
          - post
  pull_request:
    paths:
      - .github/workflows/slack-feeds.yml
      - lib/creatorFeeds.ts
      - lib/feeds.ts
      - scripts/slack-feeds.ts

permissions:
  contents: read

concurrency:
  group: slack-feeds-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  post:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 14 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'post')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Post new posts to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MEMBER_POSTS_CHANNEL_ID: ${{ vars.SLACK_MEMBER_POSTS_CHANNEL_ID }}
          SLACK_CREATOR_FEED_CHANNEL_ID: ${{ vars.SLACK_CREATOR_FEED_CHANNEL_ID }}
        run: npx tsx scripts/slack-feeds.ts

  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '30 14 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check feeds
        run: npx tsx scripts/slack-feeds.ts --check
