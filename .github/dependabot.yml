# Keeps npm packages and GitHub Actions up to date.
# Minor and patch updates arrive grouped in one monthly PR per ecosystem;
# major updates still get their own PRs so breaking changes are reviewed one at a time.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
